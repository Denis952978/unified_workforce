<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UnifiedWorkforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEE9; --surface:#FFFFFF; --surface2:#F4F7F3; --ink:#15262A; --muted:#566762; --line:#CFD8D1;
  --brand:#0D5747; --brand-ink:#FFFFFF; --brand-soft:#D6E9E1;
  --present:#18784C; --present-bg:#D8EFE2; --expected:#8E6200; --expected-bg:#F5E8C6;
  --absent:#A3302F; --absent-bg:#F5DCD8; --leave:#3A5AA3; --leave-bg:#DCE4F5;
  --done:#47554F; --done-bg:#E1E7E2; --rest:#6A6480; --rest-bg:#E7E4EF; --warn:#9B4B00; --warn-bg:#FBE6CF;
  --font:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r1:6px; --r2:12px; --shadow:0 1px 0 rgba(21,38,42,.06), 0 6px 18px -10px rgba(21,38,42,.25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1517; --surface:#152023; --surface2:#1A272A; --ink:#E2EBE7; --muted:#93A59F; --line:#2A3B3E;
  --brand:#46B893; --brand-ink:#08201A; --brand-soft:#173A31;
  --present:#5FD39A; --present-bg:#173528; --expected:#E3B451; --expected-bg:#3A2F14; --absent:#F08A82; --absent-bg:#3D1E1C;
  --leave:#8EA9EF; --leave-bg:#1D2846; --done:#B5C2BD; --done-bg:#253230; --rest:#B9B2D3; --rest-bg:#2A2738; --warn:#F2A35A; --warn-bg:#3A2614;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0E1517; --surface:#152023; --surface2:#1A272A; --ink:#E2EBE7; --muted:#93A59F; --line:#2A3B3E;
  --brand:#46B893; --brand-ink:#08201A; --brand-soft:#173A31;
  --present:#5FD39A; --present-bg:#173528; --expected:#E3B451; --expected-bg:#3A2F14; --absent:#F08A82; --absent-bg:#3D1E1C;
  --leave:#8EA9EF; --leave-bg:#1D2846; --done:#B5C2BD; --done-bg:#253230; --rest:#B9B2D3; --rest-bg:#2A2738; --warn:#F2A35A; --warn-bg:#3A2614;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6); color-scheme: dark; }
*,*::before,*::after{box-sizing:border-box}
:root{ padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack>*+*{margin-top:var(--gap,16px)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}

/* app shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%;padding-bottom:76px}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:calc(100vh - 76px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-weight:800;font-size:.85rem}
.who{padding:12px;border-radius:var(--r2);background:var(--surface2)}
.who strong{display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--r1);display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--brand-soft);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--brand)}
.nav .count{font-size:.75rem;background:var(--brand);color:var(--brand-ink);border-radius:99px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.main{padding:28px clamp(16px,3vw,40px);min-width:0;max-width:1240px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead p{margin-top:4px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.panel.flat{box-shadow:none}
.panel h2+*{margin-top:12px}
.note{border-left:3px solid var(--brand);padding:10px 14px;background:var(--surface);border-radius:0 var(--r1) var(--r1) 0}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--absent);background:var(--absent-bg)}

/* buttons & fields */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r1);cursor:pointer;font-weight:600;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--absent);border-color:currentColor}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=month],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:7px 10px;min-width:0}
textarea{min-height:72px;resize:vertical}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--done-bg);color:var(--done)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.s-PRESENT{background:var(--present-bg);color:var(--present)}
.s-EXPECTED{background:var(--expected-bg);color:var(--expected)}
.s-ABSENT{background:var(--absent-bg);color:var(--absent)}
.s-LEAVE{background:var(--leave-bg);color:var(--leave)}
.s-COMPLETED{background:var(--done-bg);color:var(--done)}
.s-REST_DAY,.s-HOLIDAY{background:var(--rest-bg);color:var(--rest)}
.s-WARN{background:var(--warn-bg);color:var(--warn)}
.s-OK{background:var(--present-bg);color:var(--present)}
.s-BAD{background:var(--absent-bg);color:var(--absent)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}
td.wrap{white-space:normal;min-width:200px}

/* counters */
.counters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.counter{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:8px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface)}
.counter b{font-size:1.4rem;font-weight:700}
.counter[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.counter:focus-visible{outline:2px solid var(--brand)}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--present);font-size:.85rem}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--present) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* employee attendance hero */
.punch{border-radius:20px;padding:clamp(22px,4vw,40px);background:var(--surface);border:1px solid var(--line);display:grid;gap:22px;max-width:720px;position:relative;overflow:hidden}
.punch::after{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--band,var(--expected))}
.punch .state{font-weight:800;font-size:.95rem;color:var(--band)}
.punch .clock{font-size:clamp(3.2rem,11vw,6.2rem);font-weight:700;letter-spacing:-.04em;line-height:.95}
.punch .meta{display:flex;gap:28px;flex-wrap:wrap}
.punch .meta div span{display:block;color:var(--muted);font-size:.85rem}
.punch .meta div b{font-size:1.25rem}
.bigbtn{all:unset;cursor:pointer;text-align:center;font-weight:800;font-size:1.25rem;letter-spacing:.06em;padding:20px 28px;border-radius:14px;background:var(--brand);color:var(--brand-ink);min-width:220px}
.bigbtn.out{background:var(--ink);color:var(--surface)}
.bigbtn:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.bigbtn:hover{filter:brightness(1.08)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.75rem;color:var(--muted);text-align:center}
.cal .cell{min-height:72px;border-radius:var(--r1);padding:6px 8px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;font-size:.78rem}
.cal .cell.blank{background:transparent;border:none}
.cal .cell b{font-size:.9rem}
.cal .cell.s-PRESENT,.cal .cell.s-COMPLETED{border-color:transparent}
.cal .cell.today{box-shadow:inset 0 0 0 2px var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px}
.stats span{display:block;color:var(--muted);font-size:.8rem}
.stats b{font-size:1.3rem;font-weight:700}

/* extension popup */
.ext{width:100%;max-width:340px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.ext-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.ext-body{padding:14px;display:grid;gap:12px}
.ext .timer{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 4px;font-size:.8rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand)}
.meter.low i{background:var(--warn)}

/* meals */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.menu button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:var(--r2);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.menu button:hover{border-color:var(--brand)}
.menu button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand);background:var(--brand-soft)}
.menu button:focus-visible{outline:2px solid var(--brand)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--brand)}

/* demo bar */
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.demobar .lbl{opacity:.65}
.demobar .clk{font-weight:700;font-size:1rem}
.demobar button,.demobar select{background:transparent;border:1px solid color-mix(in srgb,var(--surface) 35%,transparent);color:var(--surface);border-radius:var(--r1);padding:5px 10px;cursor:pointer;font-weight:600}
.demobar select option{color:#15262A;background:#fff}
.demobar .sep{width:1px;align-self:stretch;background:color-mix(in srgb,var(--surface) 25%,transparent)}
.netdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:32px 16px 110px}
.login-card{width:100%;max-width:940px;display:grid;gap:22px}
.login-card .acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.acct button{all:unset;cursor:pointer;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.acct button:hover{border-color:var(--brand)}
.acct button:focus-visible{outline:2px solid var(--brand)}
.acct small{color:var(--muted)}

/* toast + dialog */
.toast{position:fixed;right:16px;bottom:88px;z-index:40;max-width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r1);padding:12px 14px;box-shadow:var(--shadow)}
.toast.err{border-left-color:var(--absent)}
.toast code{font-weight:700}
dialog{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);color:var(--ink);padding:22px;max-width:min(560px,calc(100% - 24px));width:100%}
dialog::backdrop{background:rgba(10,20,22,.45)}
pre.json{background:var(--surface2);padding:12px;border-radius:var(--r1);overflow:auto;font-size:.8rem;max-height:60vh}
.blocked{max-width:560px;margin:10vh auto;text-align:left}
.blocked .code{font-weight:800;color:var(--absent)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--brand);vertical-align:middle}
.bar.low{background:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted)}
details summary{cursor:pointer}
.mobile-nav{display:none}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .side .nav,.side .side-foot{display:none}
  .mobile-nav{display:block}
  .mobile-nav select{width:100%}
  .who{display:none}
  .main{padding:20px 14px}
  .demobar{gap:8px;font-size:.8rem}
  .demobar .hide-m{display:none}
  .app{padding-bottom:140px}
  .login{padding-bottom:160px}
  .toast{bottom:150px}
}
.saving{font-weight:700}
body.busy #root{cursor:progress}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="root"><p style="padding:40px" class="muted">Preparing the workforce system…</p></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
